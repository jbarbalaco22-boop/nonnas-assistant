<style>
  :root {
    --bg: #f7f5f2;
    --panel: #ffffff;
    --border: #e0dcd5;
    --text: #2b2620;
    --muted: #8a8378;
    --accent: #7a5c3e;
    --accent-dark: #5f4630;
    --user-bubble: #7a5c3e;
    --assistant-bubble: #eee9e2;
    --error: #b3432b;
    --success: #3f7d4f;
    --warn-bg: #fbf1de;
    --warn-text: #93650f;
    --chart-dtc: #7a5c3e;
    --chart-tiktok: #3d7a8c;
    --chart-amazon: #b3432b;
    --chart-wholesale: #93650f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- Login screen ---- */
  #login-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  #login-box h1 { font-size: 20px; margin: 0 0 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #login-box h1 .logo-icon { width: 32px; height: 32px; }
  #login-box p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  #login-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #login-box button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #login-box button:hover { background: var(--accent-dark); }
  #login-error { color: var(--error); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ---- App shell ---- */
  #app-screen { display: none; flex: 1; flex-direction: column; height: 100vh; min-width: 0; }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  header h1 .logo-icon { width: 24px; height: 24px; }
  #header-right { display: flex; align-items: center; gap: 16px; }
  #signed-in-as { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #signed-in-as button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 13px; text-decoration: underline; padding: 0; margin-left: 8px;
  }

  /* ---- Main layout: dashboard + toggleable chat panel ---- */
  #main-layout { flex: 1; display: flex; min-height: 0; }

  /* ---- Dashboard view ---- */
  #dashboard-view { flex: 1; overflow-y: auto; min-width: 0; padding: 24px; }
  #dashboard-status { color: var(--muted); font-size: 14px; }
  #dashboard-status.error { color: var(--error); }
  #freshness-bar { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

  #range-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  #range-preset {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
  }
  #custom-range-inputs { display: none; align-items: center; gap: 8px; }
  #custom-range-inputs input[type="date"] {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
  }
  #custom-range-inputs span { font-size: 13px; color: var(--muted); }
  #apply-custom-range {
    padding: 6px 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  #apply-custom-range:hover { background: var(--accent-dark); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  #company-card { margin-bottom: 20px; }
  #company-card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 12px; }
  #company-stats { display: flex; gap: 32px; flex-wrap: wrap; }
  #company-card .metric-row { margin-top: 16px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .stat .stat-value { font-size: 26px; font-weight: 700; }
  .stat .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .positive { color: var(--success); }
  .negative { color: var(--error); }

  #channel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .channel-card h3 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  .caveat-badge {
    font-size: 10px; background: var(--warn-bg); color: var(--warn-text);
    padding: 2px 6px; border-radius: 4px; font-weight: 600; letter-spacing: 0.03em;
  }
  .channel-card .revenue-share { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .channel-card .primary-stat { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .channel-card .primary-stat-label { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .metric-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    font-size: 13px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .metric-row div { display: flex; justify-content: space-between; }
  .metric-row .metric-label { color: var(--muted); }
  #dashboard-caveat {
    margin-top: 20px; font-size: 12px; color: var(--muted); background: var(--warn-bg);
    padding: 10px 14px; border-radius: 8px; line-height: 1.5;
  }
  #contribution-note {
    margin-top: 14px; font-size: 12px; color: var(--warn-text); background: var(--warn-bg);
    padding: 8px 12px; border-radius: 8px; line-height: 1.5;
  }

  /* ---- Trends ---- */
  #trends-section { margin-top: 24px; }
  #trends-section h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    margin: 0 0 12px;
  }
  #trends-status { color: var(--muted); font-size: 14px; }
  #trends-status.error { color: var(--error); }
  #trends-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .chart-card h3 { font-size: 14px; margin: 0 0 10px; }
  .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .chart-legend-item { display: flex; align-items: center; gap: 5px; }
  .chart-legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .chart-tooltip {
    display: none;
    position: fixed;
    z-index: 300;
    background: var(--text);
    color: var(--panel);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ---- Info tooltips: hover on desktop, tap on mobile ---- */
  .info-icon {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    font-size: 10px;
    font-style: normal;
    line-height: 13px;
    text-align: center;
    cursor: help;
    margin-left: 4px;
    position: relative;
  }
  .info-icon .tooltip-text {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: 130%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--panel);
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
    width: 200px;
    z-index: 50;
    transition: opacity 0.15s ease;
    pointer-events: none;
  }
  .info-icon .tooltip-text::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -5px;
    border: 5px solid transparent;
    border-top-color: var(--text);
  }
  .info-icon:hover .tooltip-text,
  .info-icon.tapped .tooltip-text {
    visibility: visible;
    opacity: 1;
  }

  /* ---- Chat toggle button ---- */
  #chat-toggle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  #chat-toggle-btn:hover { background: var(--assistant-bubble); }
  #chat-toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* ---- Chat panel (right-hand side, toggleable) ---- */
  #chat-panel {
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--panel);
  }
  #chat-panel.hidden { display: none; }
  #chat-panel-header {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #chat-panel-header span { font-size: 14px; font-weight: 600; }
  #chat-close-btn {
    border: none; background: none; font-size: 18px; line-height: 1; cursor: pointer;
    color: var(--muted); padding: 4px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 85%; min-width: 0; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #fbe4de; color: var(--error); border-bottom-left-radius: 4px; }
  .msg.pending { align-self: flex-start; background: var(--assistant-bubble); color: var(--muted); font-style: italic; }

  #input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  #question-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
  }
  #send-btn {
    padding: 0 20px;
    border: none;
    border-radius: 20px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:hover { background: var(--accent-dark); }
  #send-btn:disabled { background: var(--muted); cursor: not-allowed; }

  /* ---- Mobile: chat panel becomes a full-screen overlay instead of a side column ---- */
  @media (max-width: 768px) {
    #chat-panel:not(.hidden) {
      position: fixed;
      inset: 0;
      width: 100%;
      z-index: 100;
    }
    #chat-panel-header { display: flex; }
    #company-stats { gap: 20px; }
    .stat .stat-value { font-size: 22px; }
    #dashboard-view { padding: 16px; }
    header { padding: 10px 14px; }
    #chat-toggle-btn span.label { display: none; }
  }
</style>
</head>

<script>
  // Hardcoded on purpose — this is a small, single-purpose internal tool, not worth build-time
  // config injection for one URL that changes essentially never.
  const API_BASE = "https://nonnas-assistant.onrender.com";
  const TOKEN_KEY = "nonnas_assistant_token";
  const CHANNELS = ["DTC", "TikTok", "Amazon", "Wholesale"];
  const UNRELIABLE_CHANNELS = new Set(["Amazon", "Wholesale"]);

  const loginScreen = document.getElementById("login-screen");
  const appScreen = document.getElementById("app-screen");
  const tokenInput = document.getElementById("token-input");
  const loginBtn = document.getElementById("login-btn");
  const loginError = document.getElementById("login-error");
  const signedInAs = document.getElementById("signed-in-as");
  const messagesEl = document.getElementById("messages");
  const questionInput = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");
  const dashboardStatus = document.getElementById("dashboard-status");
  const dashboardContent = document.getElementById("dashboard-content");

  function getStoredToken() {
    // A token in the URL (?token=...) overrides and refreshes what's stored, so a bookmarked
    // per-person link always works even if localStorage was cleared.
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get("token");
    if (urlToken) {
      localStorage.setItem(TOKEN_KEY, urlToken);
      window.history.replaceState({}, document.title, window.location.pathname);
      return urlToken;
    }
    return localStorage.getItem(TOKEN_KEY);
  }

  async function tryLogin(token) {
    try {
      const res = await fetch(`${API_BASE}/whoami`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data.user;
    } catch (e) {
      return null;
    }
  }

  function showApp(username) {
    loginScreen.style.display = "none";
    appScreen.style.display = "flex";
    signedInAs.innerHTML = `Signed in as ${username} <button id="signout-btn">Sign out</button>`;
    document.getElementById("signout-btn").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      window.location.reload();
    });
    initRangeControls();
    loadDashboard();
    loadTrends(); // independent of the date-range dashboard above - always the trailing 6 months
  }

  // ---- Date range presets ----
  // Uses the browser's local date, not UTC (see fmtDate's comment above for why - going
  // through toISOString() here would risk the same off-by-one-day shift near midnight for
  // users west of UTC).
  function pad(n) { return String(n).padStart(2, "0"); }
  function localISO(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

  function computeRange(preset) {
    const today = new Date();
    const y = today.getFullYear(), m = today.getMonth();
    if (preset === "mtd") return { start: localISO(new Date(y, m, 1)), end: localISO(today) };
    if (preset === "last-month") {
      return { start: localISO(new Date(y, m - 1, 1)), end: localISO(new Date(y, m, 0)) };
    }
    if (preset === "last-30") {
      return { start: localISO(new Date(today.getTime() - 29 * 86400000)), end: localISO(today) };
    }
    if (preset === "ytd") return { start: localISO(new Date(y, 0, 1)), end: localISO(today) };
    return null; // "custom" is handled by the Apply button, not here
  }

  // ---- Dashboard ----
  function fmtCurrency(n) {
    if (n === null || n === undefined) return "—";
    return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  function fmtPercent(n) {
    if (n === null || n === undefined) return "—";
    return (n * 100).toFixed(1) + "%";
  }
  function fmtNumber(n) {
    if (n === null || n === undefined) return "—";
    return n.toLocaleString("en-US");
  }
  function fmtDate(iso) {
    // start_date/end_date are date-only strings ("2026-08-01"), which JS parses as UTC
    // midnight - displaying that in the browser's local time zone can shift it back a day
    // (e.g. renders as "Jul 31" for someone west of UTC). Force UTC on both the parse and the
    // display so the date shown always matches the date the backend actually meant.
    return new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", {
      month: "short", day: "numeric", year: "numeric", timeZone: "UTC",
    });
  }
  function fmtDateTime(iso) {
    return new Date(iso).toLocaleString("en-US", {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });

  async function loadDashboard() {
    dashboardStatus.textContent = "Loading dashboard...";
    dashboardStatus.className = "";
    dashboardStatus.style.display = "block";
    dashboardContent.style.display = "none";

    const token = localStorage.getItem(TOKEN_KEY);
    try {
      const params = new URLSearchParams({ start_date: currentRange.start, end_date: currentRange.end });
      const res = await fetch(`${API_BASE}/dashboard?${params}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) {
        dashboardStatus.textContent = data.detail || "Couldn't load the dashboard.";
        dashboardStatus.className = "error";
        return;
      }
      renderDashboard(data);
      dashboardStatus.style.display = "none";
      dashboardContent.style.display = "block";
    } catch (e) {
      dashboardStatus.textContent = "Couldn't reach the server — check your connection and try again.";
      dashboardStatus.className = "error";
    }
  }

  // ---- Trends ----
  const CHANNEL_COLORS = {
    DTC: "var(--chart-dtc)", TikTok: "var(--chart-tiktok)",
    Amazon: "var(--chart-amazon)", Wholesale: "var(--chart-wholesale)",
  };
  function fmtMonthLabel(iso) {
    return new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", timeZone: "UTC" });
  }

  // ---- Chart hover tooltip (a floating div, not native <title> - shows instantly instead of
  // after the browser's ~1s title delay, and works the same way on tap for mobile). ----
  let chartTooltipEl = null;
  function ensureChartTooltip() {
    if (!chartTooltipEl) {
      chartTooltipEl = document.createElement("div");
      chartTooltipEl.className = "chart-tooltip";
      document.body.appendChild(chartTooltipEl);
    }
    return chartTooltipEl;
  }
  function positionChartTooltip(evt) {
    const el = ensureChartTooltip();
    const x = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const y = evt.touches ? evt.touches[0].clientY : evt.clientY;
    el.style.left = `${Math.min(x + 12, window.innerWidth - el.offsetWidth - 8)}px`;
    el.style.top = `${Math.max(y - 34, 4)}px`;
  }
  function showChartTooltip(evt, text) {
    const el = ensureChartTooltip();
    el.textContent = text;
    el.style.display = "block";
    positionChartTooltip(evt);
  }
  function hideChartTooltip() {
    if (chartTooltipEl) chartTooltipEl.style.display = "none";
  }
  document.addEventListener("touchstart", (e) => {
    if (!e.target.closest(".chart-hit")) hideChartTooltip();
  }, { passive: true });
  function chartTipAttrs(text) {
    const escaped = text.replace(/'/g, "\\'");
    return `onmouseenter="showChartTooltip(event, '${escaped}')" onmousemove="positionChartTooltip(event)" `
      + `onmouseleave="hideChartTooltip()" ontouchstart="showChartTooltip(event, '${escaped}'); event.stopPropagation();"`;
  }

  // ---- Click-to-drill-down: clicking any chart point jumps the dashboard above to that month.
  function jumpToMonth(startDate, endDate) {
    document.getElementById("range-preset").value = "custom";
    document.getElementById("custom-range-inputs").style.display = "flex";
    document.getElementById("custom-start").value = startDate;
    document.getElementById("custom-end").value = endDate;
    currentRange = { start: startDate, end: endDate };
    loadDashboard();
    document.getElementById("company-card").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function chartClickAttrs(startDate, endDate) {
    return `onclick="jumpToMonth('${startDate}', '${endDate}')" style="cursor:pointer"`;
  }

  // "Nice" round-number tick values (Sparks/Heckbert algorithm) so axis labels read as $30,000,
  // not $29,342.17 - and a min/max that always includes 0, since every one of these metrics can
  // legitimately be negative (a loss month) or positive.
  function niceNum(range, round) {
    if (range === 0) return 1;
    const exponent = Math.floor(Math.log10(range));
    const fraction = range / Math.pow(10, exponent);
    let niceFraction;
    if (round) {
      niceFraction = fraction < 1.5 ? 1 : fraction < 3 ? 2 : fraction < 7 ? 5 : 10;
    } else {
      niceFraction = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
    }
    return niceFraction * Math.pow(10, exponent);
  }
  function niceTicks(rawMin, rawMax, tickCount = 4) {
    const minV = Math.min(0, rawMin);
    const maxV = Math.max(0, rawMax === minV ? minV + 1 : rawMax);
    const spacing = niceNum((maxV - minV) / (tickCount - 1), true);
    const niceMin = Math.floor(minV / spacing) * spacing;
    const niceMax = Math.ceil(maxV / spacing) * spacing;
    const ticks = [];
    for (let v = niceMin; v <= niceMax + spacing * 0.5; v += spacing) ticks.push(v);
    return { ticks, min: niceMin, max: niceMax };
  }
  function drawYAxis(pad, width, yScale, ticks, format) {
    let svg = "";
    ticks.forEach((v) => {
      const y = yScale(v).toFixed(1);
      const emphasize = v === 0;
      svg += `<line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="${emphasize ? 0.9 : 0.5}" />`;
      svg += `<text x="2" y="${(parseFloat(y) - 2).toFixed(1)}" font-size="9" fill="var(--muted)">${format(v)}</text>`;
    });
    return svg;
  }

  // All three chart renderers measure the container's actual pixel width at render time
  // (rather than a fixed viewBox stretched with preserveAspectRatio) so points/bars aren't
  // distorted into ellipses when a card is narrower or wider than some assumed design width.
  // The container must already be visible (not display:none) when these are called, or
  // clientWidth reads 0.
  function renderLineChart(containerId, points, { color, format }) {
    const container = document.getElementById(containerId);
    const width = Math.max(container.clientWidth, 200);
    const height = 150;
    const pad = { left: 50, right: 8, top: 10, bottom: 22 };
    const values = points.map((p) => p.value);
    const { ticks, min: minV, max: maxV } = niceTicks(Math.min(...values), Math.max(...values));
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const xStep = points.length > 1 ? plotW / (points.length - 1) : 0;
    const xScale = (i) => pad.left + i * xStep;
    const yScale = (v) => pad.top + plotH - ((v - minV) / (maxV - minV)) * plotH;

    const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(i).toFixed(1)} ${yScale(p.value).toFixed(1)}`).join(" ");
    let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${height}px;">`;
    svg += drawYAxis(pad, width, yScale, ticks, format);
    svg += `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />`;
    points.forEach((p, i) => {
      const tip = chartTipAttrs(`${p.label}: ${format(p.value)}`);
      const click = p.startDate ? chartClickAttrs(p.startDate, p.endDate) : "";
      svg += `<circle class="chart-hit" cx="${xScale(i).toFixed(1)}" cy="${yScale(p.value).toFixed(1)}" r="10" fill="transparent" ${tip} ${click} />`;
      svg += `<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(p.value).toFixed(1)}" r="3.5" fill="${color}" style="pointer-events:none" />`;
    });
    points.forEach((p, i) => {
      svg += `<text x="${xScale(i).toFixed(1)}" y="${height - 6}" font-size="10" fill="var(--muted)" text-anchor="middle">${p.label}</text>`;
    });
    container.innerHTML = svg + "</svg>";
  }

  function renderBarChart(containerId, bars, { format }) {
    const container = document.getElementById(containerId);
    const width = Math.max(container.clientWidth, 200);
    const height = 150;
    const pad = { left: 50, right: 8, top: 10, bottom: 22 };
    const values = bars.map((b) => b.value);
    const { ticks, min: minV, max: maxV } = niceTicks(Math.min(...values), Math.max(...values));
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const gap = 8;
    const barW = plotW / bars.length - gap;
    const yScale = (v) => pad.top + plotH - ((v - minV) / (maxV - minV)) * plotH;
    const zeroY = yScale(0);

    let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${height}px;">`;
    svg += drawYAxis(pad, width, yScale, ticks, format);
    bars.forEach((b, i) => {
      const x = pad.left + i * (barW + gap) + gap / 2;
      const y = yScale(b.value);
      const top = Math.min(y, zeroY);
      const h = Math.max(Math.abs(y - zeroY), 1);
      const color = b.value >= 0 ? "var(--success)" : "var(--error)";
      const tip = chartTipAttrs(`${b.label}: ${format(b.value)}`);
      const click = b.startDate ? chartClickAttrs(b.startDate, b.endDate) : "";
      svg += `<rect class="chart-hit" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${color}" rx="2" ${tip} ${click} />`;
      svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${height - 6}" font-size="10" fill="var(--muted)" text-anchor="middle">${b.label}</text>`;
    });
    container.innerHTML = svg + "</svg>";
  }

  function renderMultiLineChart(containerId, seriesList, { format }) {
    const container = document.getElementById(containerId);
    const width = Math.max(container.clientWidth, 200);
    const height = 170;
    const pad = { left: 50, right: 8, top: 10, bottom: 22 };
    const allValues = seriesList.flatMap((s) => s.points.map((p) => p.value)).filter((v) => v !== null && v !== undefined);
    const { ticks, min: minV, max: maxV } = niceTicks(Math.min(...allValues), Math.max(...allValues));
    const numPoints = seriesList[0].points.length;
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const xStep = numPoints > 1 ? plotW / (numPoints - 1) : 0;
    const xScale = (i) => pad.left + i * xStep;
    const yScale = (v) => pad.top + plotH - ((v - minV) / (maxV - minV)) * plotH;

    let svg = `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${height}px;">`;
    svg += drawYAxis(pad, width, yScale, ticks, format);
    seriesList.forEach((series) => {
      // Missing months (e.g. Wholesale with $0 net sales -> contribution_pct is None) break
      // the line into segments rather than interpolating across a gap that isn't real data.
      let pathD = "";
      let drawing = false;
      series.points.forEach((p, i) => {
        if (p.value === null || p.value === undefined) { drawing = false; return; }
        pathD += `${drawing ? "L" : "M"} ${xScale(i).toFixed(1)} ${yScale(p.value).toFixed(1)} `;
        drawing = true;
      });
      svg += `<path d="${pathD}" fill="none" stroke="${series.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />`;
      series.points.forEach((p, i) => {
        if (p.value === null || p.value === undefined) return;
        const tip = chartTipAttrs(`${series.name} — ${p.label}: ${format(p.value)}`);
        const click = p.startDate ? chartClickAttrs(p.startDate, p.endDate) : "";
        svg += `<circle class="chart-hit" cx="${xScale(i).toFixed(1)}" cy="${yScale(p.value).toFixed(1)}" r="9" fill="transparent" ${tip} ${click} />`;
        svg += `<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(p.value).toFixed(1)}" r="3" fill="${series.color}" style="pointer-events:none" />`;
      });
    });
    seriesList[0].points.forEach((p, i) => {
      svg += `<text x="${xScale(i).toFixed(1)}" y="${height - 6}" font-size="10" fill="var(--muted)" text-anchor="middle">${p.label}</text>`;
    });
    container.innerHTML = svg + "</svg>";
  }

  function renderTrends(periods) {
    const labels = periods.map((p) => fmtMonthLabel(p.start_date));

    const netSalesPoints = periods.map((p, i) => ({
      label: labels[i], value: p.company.net_sales, startDate: p.start_date, endDate: p.end_date,
    }));
    renderLineChart("chart-net-sales", netSalesPoints, { color: "var(--accent)", format: fmtCurrency });

    const netIncomePoints = periods.map((p, i) => ({
      label: labels[i], value: p.company.net_income, startDate: p.start_date, endDate: p.end_date,
    }));
    renderLineChart("chart-net-income", netIncomePoints, { color: "var(--accent-dark)", format: fmtCurrency });

    const momBars = periods
      .map((p, i) => {
        if (i === 0) return null; // no prior period to compare against
        const prev = periods[i - 1].company.net_sales;
        const change = prev ? ((p.company.net_sales - prev) / prev) * 100 : 0;
        return { label: labels[i], value: change, startDate: p.start_date, endDate: p.end_date };
      })
      .filter((b) => b !== null);
    renderBarChart("chart-mom-change", momBars, { format: (v) => (v >= 0 ? "+" : "") + v.toFixed(1) + "%" });

    const channelSeries = CHANNELS.map((ch) => ({
      name: ch,
      color: CHANNEL_COLORS[ch],
      points: periods.map((p, i) => {
        const pct = p.channels[ch].contribution_pct;
        return {
          label: labels[i], value: pct !== null && pct !== undefined ? pct * 100 : null,
          startDate: p.start_date, endDate: p.end_date,
        };
      }),
    }));
    renderMultiLineChart("chart-contribution-by-channel", channelSeries, { format: (v) => v.toFixed(1) + "%" });

    document.getElementById("chart-legend").innerHTML = CHANNELS.map(
      (ch) => `<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:${CHANNEL_COLORS[ch]}"></span>${ch}</span>`
    ).join("");
  }

  async function loadTrends() {
    const trendsStatus = document.getElementById("trends-status");
    const trendsGrid = document.getElementById("trends-grid");
    const token = localStorage.getItem(TOKEN_KEY);
    try {
      const res = await fetch(`${API_BASE}/trends?months=6`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) {
        trendsStatus.textContent = data.detail || "Couldn't load trends.";
        trendsStatus.className = "error";
        return;
      }
      trendsStatus.style.display = "none";
      trendsGrid.style.display = "grid"; // must be visible before render*Chart() measures width
      renderTrends(data.periods);
    } catch (e) {
      trendsStatus.textContent = "Couldn't reach the server — check your connection and try again.";
      trendsStatus.className = "error";
    }
  }

  // ---- Chat ----
  function addMessage(text, className) {
    const el = document.createElement("div");
    el.className = `msg ${className}`;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;

  async function sendQuestion() {
    const question = questionInput.value.trim();
    if (!question) return;
    const token = localStorage.getItem(TOKEN_KEY);

    addMessage(question, "user");
    questionInput.value = "";
    sendBtn.disabled = true;
    const pending = addMessage("Thinking...", "pending");

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      pending.remove();
      if (!res.ok) {
        addMessage(data.detail || "Something went wrong.", "error");
      } else {
        addMessage(data.answer, "assistant");
      }
    } catch (e) {
      pending.remove();
      addMessage("Couldn't reach the assistant — check your connection and try again.", "error");
    } finally {
      sendBtn.disabled = false;
      questionInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendQuestion);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });

  // ---- Login ----
  loginBtn.addEventListener("click", async () => {
    const token = tokenInput.value.trim();
    if (!token) return;
    loginBtn.disabled = true;
    loginError.textContent = "";
    const username = await tryLogin(token);
    loginBtn.disabled = false;
    if (username) {
      localStorage.setItem(TOKEN_KEY, token);
      showApp(username);
    } else {
      loginError.textContent = "That token wasn't recognized. Check it and try again.";
    }
  });
  tokenInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });

  (async function init() {
    const token = getStoredToken();
    if (!token) return; // show login screen (default state)
    const username = await tryLogin(token);
    if (username) {
      showApp(username);
    } else {
      localStorage.removeItem(TOKEN_KEY);
    }
  })();
</script>

</body>
</html>
