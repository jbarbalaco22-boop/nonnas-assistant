<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harvest</title>
<style>
  :root {
    --bg: #f7f5f2;
    --panel: #ffffff;
    --border: #e0dcd5;
    --text: #2b2620;
    --muted: #8a8378;
    --accent: #7a5c3e;
    --accent-dark: #5f4630;
    --user-bubble: #7a5c3e;
    --assistant-bubble: #eee9e2;
    --error: #b3432b;
    --success: #3f7d4f;
    --warn-bg: #fbf1de;
    --warn-text: #93650f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- Login screen ---- */
  #login-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  #login-box h1 { font-size: 20px; margin: 0 0 8px; }
  #login-box p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  #login-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #login-box button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #login-box button:hover { background: var(--accent-dark); }
  #login-error { color: var(--error); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ---- App shell ---- */
  #app-screen { display: none; flex: 1; flex-direction: column; height: 100vh; min-width: 0; }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  #header-right { display: flex; align-items: center; gap: 16px; }
  #signed-in-as { font-size: 13px; color: var(--muted); white-space: nowrap; }
  #signed-in-as button {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 13px; text-decoration: underline; padding: 0; margin-left: 8px;
  }

  /* ---- Main layout: dashboard + toggleable chat panel ---- */
  #main-layout { flex: 1; display: flex; min-height: 0; }

  /* ---- Dashboard view ---- */
  #dashboard-view { flex: 1; overflow-y: auto; min-width: 0; padding: 24px; }
  #dashboard-status { color: var(--muted); font-size: 14px; }
  #dashboard-status.error { color: var(--error); }
  #freshness-bar { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

  #range-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  #range-preset {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
  }
  #custom-range-inputs { display: none; align-items: center; gap: 8px; }
  #custom-range-inputs input[type="date"] {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
  }
  #custom-range-inputs span { font-size: 13px; color: var(--muted); }
  #apply-custom-range {
    padding: 6px 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  #apply-custom-range:hover { background: var(--accent-dark); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  #company-card { margin-bottom: 20px; }
  #company-card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 12px; }
  #company-stats { display: flex; gap: 32px; flex-wrap: wrap; }
  #company-card .metric-row { margin-top: 16px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .stat .stat-value { font-size: 26px; font-weight: 700; }
  .stat .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .positive { color: var(--success); }
  .negative { color: var(--error); }

  #channel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .channel-card h3 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  .caveat-badge {
    font-size: 10px; background: var(--warn-bg); color: var(--warn-text);
    padding: 2px 6px; border-radius: 4px; font-weight: 600; letter-spacing: 0.03em;
  }
  .channel-card .revenue-share { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .channel-card .primary-stat { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .channel-card .primary-stat-label { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .metric-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    font-size: 13px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .metric-row div { display: flex; justify-content: space-between; }
  .metric-row .metric-label { color: var(--muted); }
  #dashboard-caveat {
    margin-top: 20px; font-size: 12px; color: var(--muted); background: var(--warn-bg);
    padding: 10px 14px; border-radius: 8px; line-height: 1.5;
  }
  #contribution-note {
    margin-top: 14px; font-size: 12px; color: var(--warn-text); background: var(--warn-bg);
    padding: 8px 12px; border-radius: 8px; line-height: 1.5;
  }

  /* ---- Info tooltips: hover on desktop, tap on mobile ---- */
  .info-icon {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--border);
    color: var(--muted);
    font-size: 10px;
    font-style: normal;
    line-height: 13px;
    text-align: center;
    cursor: help;
    margin-left: 4px;
    position: relative;
  }
  .info-icon .tooltip-text {
    visibility: hidden;
    opacity: 0;
    position: absolute;
    bottom: 130%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--panel);
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
    width: 200px;
    z-index: 50;
    transition: opacity 0.15s ease;
    pointer-events: none;
  }
  .info-icon .tooltip-text::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -5px;
    border: 5px solid transparent;
    border-top-color: var(--text);
  }
  .info-icon:hover .tooltip-text,
  .info-icon.tapped .tooltip-text {
    visibility: visible;
    opacity: 1;
  }

  /* ---- Chat toggle button ---- */
  #chat-toggle-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  #chat-toggle-btn:hover { background: var(--assistant-bubble); }
  #chat-toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* ---- Chat panel (right-hand side, toggleable) ---- */
  #chat-panel {
    width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--panel);
  }
  #chat-panel.hidden { display: none; }
  #chat-panel-header {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #chat-panel-header span { font-size: 14px; font-weight: 600; }
  #chat-close-btn {
    border: none; background: none; font-size: 18px; line-height: 1; cursor: pointer;
    color: var(--muted); padding: 4px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 85%; min-width: 0; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #fbe4de; color: var(--error); border-bottom-left-radius: 4px; }
  .msg.pending { align-self: flex-start; background: var(--assistant-bubble); color: var(--muted); font-style: italic; }

  #input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  #question-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
  }
  #send-btn {
    padding: 0 20px;
    border: none;
    border-radius: 20px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:hover { background: var(--accent-dark); }
  #send-btn:disabled { background: var(--muted); cursor: not-allowed; }

  /* ---- Mobile: chat panel becomes a full-screen overlay instead of a side column ---- */
  @media (max-width: 768px) {
    #chat-panel:not(.hidden) {
      position: fixed;
      inset: 0;
      width: 100%;
      z-index: 100;
    }
    #chat-panel-header { display: flex; }
    #company-stats { gap: 20px; }
    .stat .stat-value { font-size: 22px; }
    #dashboard-view { padding: 16px; }
    header { padding: 10px 14px; }
    #chat-toggle-btn span.label { display: none; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h1>Harvest</h1>
    <p>Paste your access token to sign in.</p>
    <input id="token-input" type="password" placeholder="Access token" autocomplete="off">
    <button id="login-btn">Sign in</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app-screen">
  <header>
    <h1>Harvest</h1>
    <div id="header-right">
      <button id="chat-toggle-btn">💬 <span class="label">Chat</span></button>
      <div id="signed-in-as"></div>
    </div>
  </header>

  <div id="main-layout">
    <div id="dashboard-view">
      <div id="dashboard-status">Loading dashboard...</div>
      <div id="dashboard-content" style="display:none">
        <div id="range-controls">
          <select id="range-preset">
            <option value="mtd">Month to Date</option>
            <option value="last-month">Last Month</option>
            <option value="last-30">Last 30 Days</option>
            <option value="ytd">Year to Date</option>
            <option value="custom">Custom Range</option>
          </select>
          <div id="custom-range-inputs">
            <input type="date" id="custom-start">
            <span>to</span>
            <input type="date" id="custom-end">
            <button id="apply-custom-range">Apply</button>
          </div>
        </div>
        <div id="freshness-bar"></div>
        <div id="company-card" class="card"></div>
        <div id="channel-grid"></div>
        <div id="dashboard-caveat"></div>
      </div>
    </div>

    <div id="chat-panel" class="hidden">
      <div id="chat-panel-header">
        <span>Chat</span>
        <button id="chat-close-btn">✕</button>
      </div>
      <div id="messages"></div>
      <div id="input-bar">
        <textarea id="question-input" rows="1" placeholder="Ask a question about revenue, spend, margin, units..."></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Hardcoded on purpose — this is a small, single-purpose internal tool, not worth build-time
  // config injection for one URL that changes essentially never.
  const API_BASE = "https://nonnas-assistant.onrender.com";
  const TOKEN_KEY = "nonnas_assistant_token";
  const CHANNELS = ["DTC", "TikTok", "Amazon", "Wholesale"];
  const UNRELIABLE_CHANNELS = new Set(["Amazon", "Wholesale"]);

  const loginScreen = document.getElementById("login-screen");
  const appScreen = document.getElementById("app-screen");
  const tokenInput = document.getElementById("token-input");
  const loginBtn = document.getElementById("login-btn");
  const loginError = document.getElementById("login-error");
  const signedInAs = document.getElementById("signed-in-as");
  const messagesEl = document.getElementById("messages");
  const questionInput = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");
  const dashboardStatus = document.getElementById("dashboard-status");
  const dashboardContent = document.getElementById("dashboard-content");

  function getStoredToken() {
    // A token in the URL (?token=...) overrides and refreshes what's stored, so a bookmarked
    // per-person link always works even if localStorage was cleared.
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get("token");
    if (urlToken) {
      localStorage.setItem(TOKEN_KEY, urlToken);
      window.history.replaceState({}, document.title, window.location.pathname);
      return urlToken;
    }
    return localStorage.getItem(TOKEN_KEY);
  }

  async function tryLogin(token) {
    try {
      const res = await fetch(`${API_BASE}/whoami`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data.user;
    } catch (e) {
      return null;
    }
  }

  function showApp(username) {
    loginScreen.style.display = "none";
    appScreen.style.display = "flex";
    signedInAs.innerHTML = `Signed in as ${username} <button id="signout-btn">Sign out</button>`;
    document.getElementById("signout-btn").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      window.location.reload();
    });
    initRangeControls();
    loadDashboard();
  }

  // ---- Date range presets ----
  // Uses the browser's local date, not UTC (see fmtDate's comment above for why - going
  // through toISOString() here would risk the same off-by-one-day shift near midnight for
  // users west of UTC).
  function pad(n) { return String(n).padStart(2, "0"); }
  function localISO(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

  function computeRange(preset) {
    const today = new Date();
    const y = today.getFullYear(), m = today.getMonth();
    if (preset === "mtd") return { start: localISO(new Date(y, m, 1)), end: localISO(today) };
    if (preset === "last-month") {
      return { start: localISO(new Date(y, m - 1, 1)), end: localISO(new Date(y, m, 0)) };
    }
    if (preset === "last-30") {
      return { start: localISO(new Date(today.getTime() - 29 * 86400000)), end: localISO(today) };
    }
    if (preset === "ytd") return { start: localISO(new Date(y, 0, 1)), end: localISO(today) };
    return null; // "custom" is handled by the Apply button, not here
  }

  let currentRange = computeRange("mtd");

  function initRangeControls() {
    const rangePreset = document.getElementById("range-preset");
    const customRangeInputs = document.getElementById("custom-range-inputs");
    const customStart = document.getElementById("custom-start");
    const customEnd = document.getElementById("custom-end");
    const today = localISO(new Date());
    customStart.max = today;
    customEnd.max = today;

    rangePreset.addEventListener("change", () => {
      if (rangePreset.value === "custom") {
        customRangeInputs.style.display = "flex";
        customStart.value = currentRange.start;
        customEnd.value = currentRange.end;
      } else {
        customRangeInputs.style.display = "none";
        currentRange = computeRange(rangePreset.value);
        loadDashboard();
      }
    });

    document.getElementById("apply-custom-range").addEventListener("click", () => {
      if (!customStart.value || !customEnd.value) return;
      currentRange = { start: customStart.value, end: customEnd.value };
      loadDashboard();
    });
  }

  // ---- Chat panel show/hide ----
  const chatPanel = document.getElementById("chat-panel");
  const chatToggleBtn = document.getElementById("chat-toggle-btn");
  const chatCloseBtn = document.getElementById("chat-close-btn");

  function openChat() {
    chatPanel.classList.remove("hidden");
    chatToggleBtn.classList.add("active");
    questionInput.focus();
  }
  function closeChat() {
    chatPanel.classList.add("hidden");
    chatToggleBtn.classList.remove("active");
  }
  chatToggleBtn.addEventListener("click", () => {
    chatPanel.classList.contains("hidden") ? openChat() : closeChat();
  });
  chatCloseBtn.addEventListener("click", closeChat);

  // ---- Dashboard ----
  function fmtCurrency(n) {
    if (n === null || n === undefined) return "—";
    return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  function fmtPercent(n) {
    if (n === null || n === undefined) return "—";
    return (n * 100).toFixed(1) + "%";
  }
  function fmtNumber(n) {
    if (n === null || n === undefined) return "—";
    return n.toLocaleString("en-US");
  }
  function fmtDate(iso) {
    // start_date/end_date are date-only strings ("2026-08-01"), which JS parses as UTC
    // midnight - displaying that in the browser's local time zone can shift it back a day
    // (e.g. renders as "Jul 31" for someone west of UTC). Force UTC on both the parse and the
    // display so the date shown always matches the date the backend actually meant.
    return new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", {
      month: "short", day: "numeric", year: "numeric", timeZone: "UTC",
    });
  }
  function fmtDateTime(iso) {
    return new Date(iso).toLocaleString("en-US", {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });
  }

  const TOOLTIPS = {
    contribution: "Revenue minus product cost, fulfillment, ad spend, and marketing tools. Does NOT include overhead (payroll, rent, insurance, admin, etc.) — see the note below.",
    ads: "Paid advertising only: Meta, Google, TikTok Ads, Amazon Ads, and (for DTC) Marketplace Advertising.",
    otherMarketing: "Marketing costs that aren't paid ads — currently just email & SMS marketing tools.",
    roas: "Return on ad spend: net sales ÷ ad spend. Higher means each ad dollar is generating more revenue.",
    discountRate: "Total discounts given, as a percent of gross sales before discounts.",
    refundRate: "Total refunds, as a percent of gross sales before refunds.",
    ordersUnits: "Source: Shopify order data.",
  };
  function infoIcon(key) {
    return `<span class="info-icon" tabindex="0">&#9432;<span class="tooltip-text">${TOOLTIPS[key]}</span></span>`;
  }
  // Tooltips open on hover on desktop (CSS-only); this makes tap work on mobile, where
  // hover doesn't exist - tapping one icon opens it and closes any other open one.
  document.addEventListener("click", (e) => {
    const icon = e.target.closest(".info-icon");
    document.querySelectorAll(".info-icon.tapped").forEach((el) => {
      if (el !== icon) el.classList.remove("tapped");
    });
    if (icon) icon.classList.toggle("tapped");
  });

  function renderDashboard(data) {
    document.getElementById("freshness-bar").textContent =
      `Showing ${fmtDate(data.start_date)} – ${fmtDate(data.end_date)} · Live as of ${fmtDateTime(data.generated_at)}`;

    const c = data.company;
    const contribClass = c.contribution >= 0 ? "positive" : "negative";
    document.getElementById("company-card").innerHTML = `
      <h2>Company Overview</h2>
      <div id="company-stats">
        <div class="stat"><div class="stat-value">${fmtCurrency(c.net_sales)}</div><div class="stat-label">Net Sales</div></div>
        <div class="stat"><div class="stat-value ${contribClass}">${fmtCurrency(c.contribution)}</div><div class="stat-label">Contribution (before overhead)${infoIcon("contribution")}</div></div>
        <div class="stat"><div class="stat-value ${contribClass}">${fmtPercent(c.contribution_pct)}</div><div class="stat-label">Contribution Margin (before overhead)</div></div>
      </div>
      <div id="contribution-note">Contribution does not include overhead — payroll, rent, insurance, admin, and other company-wide costs. The company can show positive contribution here while still losing money overall.</div>
      <div class="metric-row">
        <div><span class="metric-label">Orders${infoIcon("ordersUnits")}</span><span>${fmtNumber(c.orders)}</span></div>
        <div><span class="metric-label">AOV</span><span>${fmtCurrency(c.aov)}</span></div>
        <div><span class="metric-label">Units${infoIcon("ordersUnits")}</span><span>${fmtNumber(c.units)}</span></div>
        <div><span class="metric-label">Discount Rate${infoIcon("discountRate")}</span><span>${fmtPercent(c.discount_rate)}</span></div>
        <div><span class="metric-label">Refund Rate${infoIcon("refundRate")}</span><span>${fmtPercent(c.refund_rate)}</span></div>
        <div><span class="metric-label">ROAS${infoIcon("roas")}</span><span>${c.roas !== null && c.roas !== undefined ? c.roas.toFixed(1) + "x" : "—"}</span></div>
        <div><span class="metric-label">Ad Spend${infoIcon("ads")}</span><span>${fmtCurrency(c.ads)}</span></div>
        <div><span class="metric-label">Other Marketing${infoIcon("otherMarketing")}</span><span>${fmtCurrency(c.other_marketing)}</span></div>
      </div>
    `;

    const grid = document.getElementById("channel-grid");
    grid.innerHTML = "";
    for (const ch of CHANNELS) {
      const m = data.channels[ch];
      if (!m) continue;
      const contribClass = m.contribution >= 0 ? "positive" : "negative";
      const badge = UNRELIABLE_CHANNELS.has(ch)
        ? `<span class="caveat-badge" title="See caveat below">LIMITED DATA</span>`
        : "";
      const card = document.createElement("div");
      card.className = "card channel-card";
      card.innerHTML = `
        <h3>${ch} ${badge}</h3>
        <div class="revenue-share">${fmtPercent(m.revenue_share)} of total revenue</div>
        <div class="primary-stat ${contribClass}">${fmtCurrency(m.contribution)}</div>
        <div class="primary-stat-label">Contribution before overhead (${fmtPercent(m.contribution_pct)} margin)${infoIcon("contribution")}</div>
        <div class="metric-row">
          <div><span class="metric-label">Net Sales</span><span>${fmtCurrency(m.net_sales)}</span></div>
          <div><span class="metric-label">Orders${infoIcon("ordersUnits")}</span><span>${fmtNumber(m.orders)}</span></div>
          <div><span class="metric-label">AOV</span><span>${fmtCurrency(m.aov)}</span></div>
          <div><span class="metric-label">Units${infoIcon("ordersUnits")}</span><span>${fmtNumber(m.units)}</span></div>
          <div><span class="metric-label">Discount Rate${infoIcon("discountRate")}</span><span>${fmtPercent(m.discount_rate)}</span></div>
          <div><span class="metric-label">Refund Rate${infoIcon("refundRate")}</span><span>${fmtPercent(m.refund_rate)}</span></div>
          <div><span class="metric-label">ROAS${infoIcon("roas")}</span><span>${m.roas !== null && m.roas !== undefined ? m.roas.toFixed(1) + "x" : "—"}</span></div>
          <div><span class="metric-label">Ad Spend${infoIcon("ads")}</span><span>${fmtCurrency(m.ads)}</span></div>
          <div><span class="metric-label">Other Marketing${infoIcon("otherMarketing")}</span><span>${fmtCurrency(m.other_marketing)}</span></div>
        </div>
      `;
      grid.appendChild(card);
    }

    document.getElementById("dashboard-caveat").textContent = data.caveat || "";
  }

  async function loadDashboard() {
    dashboardStatus.textContent = "Loading dashboard...";
    dashboardStatus.className = "";
    dashboardStatus.style.display = "block";
    dashboardContent.style.display = "none";

    const token = localStorage.getItem(TOKEN_KEY);
    try {
      const params = new URLSearchParams({ start_date: currentRange.start, end_date: currentRange.end });
      const res = await fetch(`${API_BASE}/dashboard?${params}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok) {
        dashboardStatus.textContent = data.detail || "Couldn't load the dashboard.";
        dashboardStatus.className = "error";
        return;
      }
      renderDashboard(data);
      dashboardStatus.style.display = "none";
      dashboardContent.style.display = "block";
    } catch (e) {
      dashboardStatus.textContent = "Couldn't reach the server — check your connection and try again.";
      dashboardStatus.className = "error";
    }
  }

  // ---- Chat ----
  function addMessage(text, className) {
    const el = document.createElement("div");
    el.className = `msg ${className}`;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  async function sendQuestion() {
    const question = questionInput.value.trim();
    if (!question) return;
    const token = localStorage.getItem(TOKEN_KEY);

    addMessage(question, "user");
    questionInput.value = "";
    sendBtn.disabled = true;
    const pending = addMessage("Thinking...", "pending");

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      pending.remove();
      if (!res.ok) {
        addMessage(data.detail || "Something went wrong.", "error");
      } else {
        addMessage(data.answer, "assistant");
      }
    } catch (e) {
      pending.remove();
      addMessage("Couldn't reach the assistant — check your connection and try again.", "error");
    } finally {
      sendBtn.disabled = false;
      questionInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendQuestion);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });

  // ---- Login ----
  loginBtn.addEventListener("click", async () => {
    const token = tokenInput.value.trim();
    if (!token) return;
    loginBtn.disabled = true;
    loginError.textContent = "";
    const username = await tryLogin(token);
    loginBtn.disabled = false;
    if (username) {
      localStorage.setItem(TOKEN_KEY, token);
      showApp(username);
    } else {
      loginError.textContent = "That token wasn't recognized. Check it and try again.";
    }
  });
  tokenInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });

  (async function init() {
    const token = getStoredToken();
    if (!token) return; // show login screen (default state)
    const username = await tryLogin(token);
    if (username) {
      showApp(username);
    } else {
      localStorage.removeItem(TOKEN_KEY);
    }
  })();
</script>

</body>
</html>
